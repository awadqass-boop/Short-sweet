<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track My Shorties — Short & Sweet</title><link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml"><link rel="icon" href="assets/favicon-32.png?v=2" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2"><script src="config.js"></script><script defer src="analytics.js"></script>
<style>
:root{--brown:#351811;--gold:#d8b35d;--beige:#ead7a1;--cream:#fff2cf}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,var(--beige),#f6e7ba);font-family:Arial,sans-serif;color:var(--brown);background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.18) 0 2px,transparent 3px);background-size:44px 44px}.wrap{width:min(92%,760px);margin:auto;padding:44px 0 70px}.back{font-weight:900}.card{background:var(--cream);padding:38px;border-radius:32px;box-shadow:0 30px 70px #35181125;margin-top:28px}h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(40px,8vw,58px);letter-spacing:-2px;line-height:.95;margin:0 0 10px}.lead{font-size:18px;line-height:1.6}.lookup{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin:28px 0}.lookup input{padding:15px 18px;border:2px solid #35181122;border-radius:999px;background:white;font-size:16px;min-width:0}.lookup button{border:0;border-radius:999px;padding:0 24px;background:var(--brown);color:var(--cream);font-weight:900}.message{padding:17px 20px;border-radius:18px;background:#fff8e8}.status{background:var(--brown);color:var(--cream);border-radius:26px;padding:28px}.status-top{display:flex;justify-content:space-between;gap:16px}.status h2{font-size:30px;margin:8px 0}.badge{background:var(--gold);color:var(--brown);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:900;height:max-content}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:24px 0 10px}.step{height:8px;border-radius:9px;background:#ffffff30}.step.on{background:var(--gold)}.labels{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;font-size:9px;text-align:center;opacity:.85}.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center;font-size:20px;margin-top:14px}.icons span{opacity:.35;transition:transform .2s ease,opacity .2s ease}.icons span.on{opacity:1;transform:scale(1.12)}.meta{margin-top:18px;padding-top:18px;border-top:1px solid #ffffff22;line-height:1.7;font-size:14px}@media(max-width:650px){.lookup{grid-template-columns:1fr}.lookup button{padding:14px}.labels{display:none}.card{padding:26px}}
</style></head><body><div class="wrap"><a class="back" href="index.html">← SHORT & SWEET</a><div class="card"><h1>Track my Shorties.</h1><p class="lead">Enter your order number and the phone number used at checkout.</p><div class="lookup"><input id="id" placeholder="Order number"><input id="phone" placeholder="Phone number"><button onclick="show()">Track</button></div><div id="result"></div></div></div>
<script>
const API=(window.SHORT_SWEET_API||"").replace(/\/$/,"");
const copy={
  received:["Order received! 🤎","We have your order and will confirm the details with you on WhatsApp."],
  confirmed:["Your order is confirmed ✨","Everything is confirmed and your order is in our schedule."],
  preparing:["Your Shorties are getting made! 🍪","Your treats are being prepared."],
  ready:["Your Shorties are dressed & ready 🤎","Everything is packed and ready for pickup or the next delivery step."],
  delivery:["Your Shorties are running your way! 🏃🍪","Your order is out for delivery."],
  delivered:["Shorties have landed. Enjoyyy! 🤎","Your order has been delivered."],
  cancelled:["Order cancelled","Please contact Short & Sweet if you need help."]
};
const rank={received:0,confirmed:1,preparing:2,ready:3,delivery:4,delivered:5};
const labels=["Received","Confirmed","Preparing","Ready","On the way","Delivered"];
const icons=["🤎","✨","🍪","🎁","🏃","🤎"];
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function result(h){document.getElementById("result").innerHTML=h}
async function show(){
  const id=document.getElementById("id").value.trim().toUpperCase(),phone=document.getElementById("phone").value.trim();
  if(!id||!phone){result('<div class="message">Enter both your order number and phone number.</div>');return}
  if(!API){result('<div class="message">For order updates, please <a href="https://wa.me/971567708220?text=Hi%20Short%20%26%20Sweet!%20I%27d%20like%20an%20update%20on%20my%20order." target="_blank" rel="noopener">message us on WhatsApp</a>.</div>');return}
  result('<div class="message">Checking your order...</div>');
  try{
    const r=await fetch(API+"/orders/"+encodeURIComponent(id)+"?phone="+encodeURIComponent(phone)),o=await r.json();
    if(!r.ok)throw new Error(o.error||"Order not found.");
    const state=copy[o.status]?o.status:"received",c=copy[state],items=(o.items||[]).map(x=>x.qty+" × "+(x.name||x.sku)).join(", ");
    const pos=rank[state]??0,fee=Number(o.delivery_fee||0),total=Number(o.total_aed||0),subtotal=Number(o.subtotal_aed??total-fee);
    result('<div class="status"><div class="status-top"><div><small>ORDER #'+esc(o.order_number)+'</small><h2>'+c[0]+'</h2><p>'+c[1]+'</p></div><span class="badge">'+esc(labels[pos]||state.toUpperCase())+'</span></div>'+
      (state==="cancelled"?'':'<div class="icons">'+icons.map((x,i)=>'<span class="'+(i<=pos?'on':'')+'">'+x+'</span>').join("")+'</div><div class="steps">'+labels.map((_,i)=>'<span class="step '+(i<=pos?'on':'')+'"></span>').join("")+'</div><div class="labels">'+labels.map(x=>'<span>'+x+'</span>').join("")+'</div>')+
      '<div class="meta"><div><b>Method:</b> '+esc(o.fulfillment_type||"delivery")+'</div><div><b>Order:</b> '+esc(items)+'</div><div><b>Subtotal:</b> AED '+esc(subtotal)+'</div>'+(fee?'<div><b>Delivery:</b> AED '+esc(fee)+'</div>':'')+'<div><b>Total:</b> AED '+esc(total)+'</div>'+(o.preferred_date?'<div><b>Date:</b> '+esc(o.preferred_date)+(o.preferred_time?' · '+esc(o.preferred_time):'')+'</div>':'')+'</div></div>');
  }catch(e){result('<div class="message">'+esc(e.message||"We couldn’t find that order.")+'</div>')}
}
const p=new URLSearchParams(location.search);
if(p.get("order"))document.getElementById("id").value=p.get("order");
if(p.get("phone"))document.getElementById("phone").value=p.get("phone");
if(p.get("order")&&p.get("phone"))show();
</script></body></html>
